<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>SecureInbox — Split-Pane Forensic Inspector (Concept C)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       SecureInbox Design Tokens — Concept C: Split-Pane Forensic Inspector
       ========================================================================== */
    :root {
      /* Surfaces */
      --bg-canvas: #090d13;
      --bg-panel: #0d1117;
      --bg-card: #13171f;
      --bg-card-hover: #171d27;
      --bg-elevated: #1a202c;
      --bg-inset: #0a0d14;
      --bg-overlay: rgba(9, 13, 19, 0.85);

      /* Borders */
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-default: #21262d;
      --border-strong: #30363d;
      --border-focus: #6f8bf5;

      /* Typography */
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;

      /* Text hierarchy */
      --text-primary: #f0f6fc;
      --text-secondary: #c9d1d9;
      --text-muted: #8b949e;
      --text-tertiary: #586069;

      /* Core Forensic Palette */
      --color-primary: #6f8bf5;
      --color-primary-soft: rgba(111, 139, 245, 0.14);
      --color-primary-hover: #8ba1f8;

      /* Severity Ramp (WCAG AA Compliant) */
      --risk-critical: #f43f5e;
      --risk-critical-soft: rgba(244, 63, 94, 0.12);
      --risk-critical-border: rgba(244, 63, 94, 0.35);

      --risk-high: #fb7185;
      --risk-high-soft: rgba(251, 113, 133, 0.12);

      --risk-warning: #f59e0b;
      --risk-warning-soft: rgba(245, 158, 11, 0.12);
      --risk-warning-border: rgba(245, 158, 11, 0.35);

      --risk-pass: #10b981;
      --risk-pass-soft: rgba(16, 185, 129, 0.12);
      --risk-pass-border: rgba(16, 185, 129, 0.32);

      --risk-info: #38bdf8;
      --risk-info-soft: rgba(56, 189, 248, 0.12);

      /* Layout Dimensions */
      --header-h: 56px;
      --left-pane-w: 420px;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 10px;
    }

    /* Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #21262d;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #30363d;
    }

    /* Selection */
    ::selection {
      background: rgba(111, 139, 245, 0.3);
      color: #ffffff;
    }

    /* ==========================================================================
       Top Navigation Bar
       ========================================================================== */
    .topbar {
      height: var(--header-h);
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-default);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 50;
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      color: var(--text-primary);
    }

    .brand-logo {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, #6f8bf5 0%, #3b50c4 100%);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(111, 139, 245, 0.35);
    }

    .brand-name {
      font-size: 0.9375rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: #ffffff;
    }

    .concept-tag {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ba1b0;
      background: rgba(255, 255, 255, 0.04);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
    }

    .topbar-metrics {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-left: 20px;
      border-left: 1px solid var(--border-default);
      padding-left: 18px;
    }

    .metric-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .metric-value {
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .metric-value.critical {
      color: var(--risk-critical);
    }

    .live-pulse {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--risk-pass);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--risk-pass);
      animation: pulse 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .kbd-guide {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
    }

    .kbd {
      padding: 1px 4px;
      border-radius: 3px;
      background: #21262d;
      color: var(--text-secondary);
      border: 1px solid #30363d;
      font-size: 0.65rem;
    }

    .profile-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .avatar-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-primary);
    }

    /* ==========================================================================
       Master-Detail Split Workspace
       ========================================================================== */
    .split-workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - var(--header-h));
      overflow: hidden;
    }

    /* ==========================================================================
       Left Pane: Live Flagged Email Feed (40%)
       ========================================================================== */
    .left-pane {
      width: 40%;
      min-width: 360px;
      max-width: 480px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-default);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    .left-pane-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-default);
      background: var(--bg-panel);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .feed-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .feed-heading {
      font-size: 0.8125rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .feed-counter {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      background: var(--risk-critical-soft);
      color: var(--risk-critical);
      border: 1px solid var(--risk-critical-border);
      padding: 1px 6px;
      border-radius: 999px;
      font-weight: 600;
    }

    .feed-sort-select {
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-family: inherit;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      outline: none;
      cursor: pointer;
    }
    .feed-sort-select:focus {
      border-color: var(--color-primary);
    }

    .feed-search-bar {
      position: relative;
    }

    .search-input {
      width: 100%;
      height: 32px;
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      padding: 0 10px 0 30px;
      font-size: 0.8125rem;
      color: var(--text-primary);
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .search-input:focus {
      border-color: var(--color-primary);
      background: var(--bg-canvas);
    }
    .search-input::placeholder {
      color: var(--text-tertiary);
    }

    .search-icon {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .filter-tabs {
      display: flex;
      gap: 4px;
      padding: 0 16px 10px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-panel);
    }

    .filter-btn {
      flex: 1;
      padding: 4px 6px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .filter-btn:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
    }
    .filter-btn.active {
      background: var(--bg-card);
      border-color: var(--border-default);
      color: var(--text-primary);
      font-weight: 600;
    }

    .filter-btn .count-tag {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      opacity: 0.7;
    }

    /* Email Feed List */
    .email-feed {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 6px 8px;
    }

    .email-item {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      margin-bottom: 6px;
      padding: 10px 12px;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background-color 0.12s ease;
      outline: none;
    }
    .email-item:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-strong);
    }
    .email-item.selected {
      background: #151a24;
      border-color: var(--color-primary);
      box-shadow: inset 3px 0 0 var(--color-primary), 0 2px 10px rgba(0, 0, 0, 0.4);
    }

    .email-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .urgency-pill {
      font-family: var(--font-mono);
      font-size: 0.625rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .urgency-pill.immediate {
      background: var(--risk-critical-soft);
      color: var(--risk-critical);
      border: 1px solid var(--risk-critical-border);
    }

    .urgency-pill.elevated {
      background: var(--risk-warning-soft);
      color: var(--risk-warning);
      border: 1px solid var(--risk-warning-border);
    }

    .urgency-pill.standard {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }

    .urgency-pill.clean {
      background: var(--risk-pass-soft);
      color: var(--risk-pass);
      border: 1px solid var(--risk-pass-border);
    }

    .item-time {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      color: var(--text-muted);
    }

    .sender-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 3px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .sender-name {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sender-address {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .subject-line {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      font-weight: 450;
      line-height: 1.35;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .item-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .item-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      flex: 1;
      overflow: hidden;
      max-height: 22px;
    }

    .tag-mono {
      font-family: var(--font-mono);
      font-size: 0.625rem;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .tag-mono.danger {
      color: var(--risk-critical);
      border-color: rgba(244, 63, 94, 0.3);
      background: rgba(244, 63, 94, 0.08);
    }

    .tag-mono.warning {
      color: var(--risk-warning);
      border-color: rgba(245, 158, 11, 0.3);
      background: rgba(245, 158, 11, 0.08);
    }

    .score-meter-compact {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .score-val {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
    }

    .score-bar-mini {
      width: 32px;
      height: 4px;
      background: #21262d;
      border-radius: 2px;
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      border-radius: 2px;
    }

    /* Disposition status pill */
    .status-badge-inline {
      font-family: var(--font-mono);
      font-size: 0.625rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      margin-left: auto;
    }
    .status-badge-inline.quarantined {
      background: rgba(244, 63, 94, 0.2);
      color: var(--risk-critical);
      border: 1px solid var(--risk-critical-border);
    }
    .status-badge-inline.allowlisted {
      background: rgba(16, 185, 129, 0.2);
      color: var(--risk-pass);
      border: 1px solid var(--risk-pass-border);
    }

    /* ==========================================================================
       Right Pane: Live Forensic Deep-Dive (60%)
       ========================================================================== */
    .right-pane {
      flex: 1;
      background: var(--bg-canvas);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Sticky Action & Breadcrumb Bar */
    .forensic-toolbar {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-default);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .incident-code {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .meta-crumb {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .meta-crumb span.separator {
      color: var(--border-strong);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .action-btn {
      height: 32px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      outline: none;
      font-family: inherit;
    }

    .action-btn.btn-quarantine {
      background: #c62828;
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #ffffff;
      box-shadow: 0 1px 6px rgba(198, 40, 40, 0.35);
    }
    .action-btn.btn-quarantine:hover {
      background: #dc2626;
      border-color: var(--risk-critical);
    }

    .action-btn.btn-secondary {
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      color: var(--text-secondary);
    }
    .action-btn.btn-secondary:hover {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .action-btn.btn-ghost {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
    }
    .action-btn.btn-ghost:hover {
      background: var(--bg-card);
      color: var(--text-secondary);
      border-color: var(--border-default);
    }

    .action-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Sub-tabs for Forensic Views */
    .forensic-tabs {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-default);
      padding: 0 20px;
      display: flex;
      gap: 20px;
      flex-shrink: 0;
    }

    .f-tab {
      padding: 10px 0;
      font-size: 0.78125rem;
      font-weight: 500;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.12s ease, border-color 0.12s ease;
    }
    .f-tab:hover {
      color: var(--text-primary);
    }
    .f-tab.active {
      color: #ffffff;
      font-weight: 600;
      border-bottom-color: var(--color-primary);
    }
    .f-tab .tab-badge {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      padding: 1px 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-secondary);
    }

    /* Forensic View Body */
    .forensic-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Section 1: Verdict Banner */
    .verdict-banner {
      background: linear-gradient(180deg, rgba(26, 32, 44, 0.6) 0%, rgba(19, 23, 31, 0.9) 100%);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      position: relative;
      overflow: hidden;
    }

    .verdict-banner::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--risk-critical);
    }
    .verdict-banner.warning::before {
      background: var(--risk-warning);
    }
    .verdict-banner.clean::before {
      background: var(--risk-pass);
    }

    .verdict-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 14px;
    }

    .verdict-main-meta {
      flex: 1;
    }

    .verdict-badge-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .verdict-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .verdict-label.critical {
      background: var(--risk-critical-soft);
      color: var(--risk-critical);
      border: 1px solid var(--risk-critical-border);
    }
    .verdict-label.warning {
      background: var(--risk-warning-soft);
      color: var(--risk-warning);
      border: 1px solid var(--risk-warning-border);
    }
    .verdict-label.clean {
      background: var(--risk-pass-soft);
      color: var(--risk-pass);
      border: 1px solid var(--risk-pass-border);
    }

    .engine-confidence {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .verdict-subject {
      font-size: 1.125rem;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.35;
      margin-bottom: 6px;
    }

    .verdict-sender-detail {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

      align-items: center;

    }
    .auth-status-pill.fail {
      background: var(--risk-critical-soft);
      color: var(--risk-critical);

    .auth-k {
      color: var(--text-tertiary);
      font-size: 0.65rem;
      text-transform: uppercase;
      font-family: var(--font-mono);
    }

    .auth-v {
      font-family: var(--font-mono);
      color: var(--text-primary);

    .hash-copy-bar {

    .copy-btn {

      font-size: 0.75rem;
      color: #fca5a5;
      line-height: 1.4;
      font-family: var(--font-sans);
    }

    /* Section 4: Raw Header Snippet Viewer */
    .raw-headers-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .raw-headers-toggle-bar {
      padding: 12px 18px;
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: background 0.12s ease;

    .raw-headers-toggle-bar:hover {
      background: var(--bg-card-hover);
    }

    .raw-headers-title {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .raw-headers-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-chevron {
      transition: transform 0.2s ease;
      color: var(--text-muted);

      transform: rotate(180deg);

    .raw-headers-content {
      border-top: 1px solid var(--border-default);
      background: var(--bg-inset);
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s cubic-bezier(0, 1, 0, 1);

    .raw-headers-content.expanded {
      max-height: 500px;
      overflow-y: auto;
      transition: max-height 0.3s ease-in-out;
    }

    .raw-header-pre {
      margin: 0;
      padding: 14px 18px;
      font-family: var(--font-mono);
      font-size: 0.71875rem;
      line-height: 1.6;
      color: var(--text-secondary);
      white-space: pre;
      overflow-x: auto;
    }

    .raw-header-pre .hk {
      color: #38bdf8;
      font-weight: 600;
    }
    .raw-header-pre .hv {
      color: #c9d1d9;
    }
    .raw-header-pre .h-warn {
      color: #fb7185;
      background: rgba(244, 63, 94, 0.14);
      padding: 1px 3px;
      border-radius: 2px;
    }

    /* Section 5: Sanitized Message Body (Tab view) */
    .message-body-card {
      background: var(--bg-canvas);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 16px;
      font-size: 0.84rem;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .body-header-meta {
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 12px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.78125rem;
    }

    .meta-line {
      display: flex;
      gap: 8px;
    }
    .meta-line-k {
      color: var(--text-tertiary);
      width: 65px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
    }
    .meta-line-v {
      color: var(--text-primary);
    }

    .body-text-rendered {
      white-space: pre-wrap;
      font-family: var(--font-sans);
    }

    .body-link-flagged {
      color: var(--risk-critical);
      text-decoration: underline;
      background: rgba(244, 63, 94, 0.1);
      padding: 0 4px;
      border-radius: 2px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
    }

    /* Toast Notification Overlay */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast-card {
      background: #191e28;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      color: #ffffff;
      font-size: 0.8125rem;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 300px;
      max-width: 440px;
      animation: slideIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: auto;
    }

    .toast-card.danger {
      border-color: rgba(244, 63, 94, 0.5);
      background: #1e1317;
    }
    .toast-card.success {
      border-color: rgba(16, 185, 129, 0.5);
      background: #0f1c18;
    }

    @keyframes slideIn {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      text-align: center;
      gap: 12px;
      padding: 40px;
    }

    /* Subtle animation on email switch */
    .fade-swap {
      animation: fadeIn 0.16s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0.4; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

    /**
     * Get filtered and sorted email list
     */
    function getVisibleIncidents() {
      const searchTerm = searchInputEl.value.trim().toLowerCase();
      let list = [...INCIDENT_DATABASE];

      // Filter category
      if (currentFilter === "critical") {
        list = list.filter(item => item.riskScore >= 90);
      } else if (currentFilter === "high") {
        list = list.filter(item => item.riskScore >= 60 && item.riskScore < 90);
      } else if (currentFilter === "suspicious") {
        list = list.filter(item => item.riskScore < 60);
      }

      // Search term filter
      if (searchTerm) {
        list = list.filter(item =>
          item.subject.toLowerCase().includes(searchTerm) ||
          item.sender.name.toLowerCase().includes(searchTerm) ||
          item.sender.address.toLowerCase().includes(searchTerm) ||
          item.id.toLowerCase().includes(searchTerm) ||
          item.detectionBadges.some(b => b.text.toLowerCase().includes(searchTerm))
        );
      }

      // Sorting
      const sortVal = sortSelectEl.value;
      if (sortVal === "risk-desc") {
        list.sort((a, b) => b.riskScore - a.riskScore);
      } else if (sortVal === "urgency-desc") {
        const urgencyWeight = { IMMEDIATE: 3, ELEVATED: 2, STANDARD: 1 };
        list.sort((a, b) => (urgencyWeight[b.urgency] || 0) - (urgencyWeight[a.urgency] || 0));
      }

      return list;
    }

    /**
     * Render Left Pane Feed
     */
    function renderEmailList() {
      const visible = getVisibleIncidents();
      feedCounterBadge.textContent = visible.length;
      topFlaggedCount.textContent = visible.filter(i => i.status === "active" && i.riskScore >= 60).length;

      if (visible.length === 0) {
        emailListEl.innerHTML = `

        `;
        return;
      }

      // Ensure selected ID is in visible list
      if (!visible.some(item => item.id === currentSelectedId)) {
        currentSelectedId = visible[0].id;
      }

      emailListEl.innerHTML = visible.map(email => {
        const isSelected = email.id === currentSelectedId;
        const scoreColor = email.riskScore >= 90 ? "var(--risk-critical)" :
                           email.riskScore >= 60 ? "var(--risk-high)" :

                  </div>

                  <div class="hash-copy-bar">
                    <span style="font-size: 0.65rem; color: var(--text-tertiary); text-transform: uppercase;">SHA-256</span>
                    <span class="hash-text">${escapeHtml(att.sha256)}</span>
                    <button class="copy-btn" onclick="copyText('${escapeHtml(att.sha256)}')">Copy Hash</button>
                  </div>

                  <div class="sandbox-finding-alert">
                    <strong>Dynamic Execution Alert [${escapeHtml(att.detonationVerdict)}]:</strong>
                    ${escapeHtml(att.sandboxBehavior)}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    /**
     * Render Message Body Preview Tab
     */
    function renderBodyView(email) {
      forensicBodyEl.innerHTML = `
        <div class="fade-swap">
          <div class="message-body-card">
            <div class="body-header-meta">
              <div class="meta-line">
                <span class="meta-line-k">FROM:</span>
                <span class="meta-line-v">${escapeHtml(email.sender.name)} &lt;${escapeHtml(email.sender.address)}&gt;</span>
              </div>
              <div class="meta-line">
                <span class="meta-line-k">REPLY-TO:</span>
                <span class="meta-line-v" style="${email.sender.replyTo !== email.sender.address ? 'color: var(--risk-warning);' : ''}">${escapeHtml(email.sender.replyTo)}</span>
              </div>
              <div class="meta-line">
                <span class="meta-line-k">SUBJECT:</span>
                <span class="meta-line-v" style="font-weight: 600;">${escapeHtml(email.subject)}</span>
              </div>
              <div class="meta-line">
                <span class="meta-line-k">DATE:</span>
                <span class="meta-line-v">${email.receivedAt}</span>
              </div>
            </div>

            <div class="body-text-rendered">
              ${highlightBodyThreats(email.bodyText)}
            </div>
          </div>
        </div>
      `;
    }

    /**
     * Render Headers Tab
     */
    function renderHeadersView(email) {
      forensicBodyEl.innerHTML = `
        <div class="fade-swap">
          <div class="raw-headers-panel">
            <div class="raw-headers-toggle-bar" style="cursor: default;">
              <div class="raw-headers-title">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="4 17 10 11 4 5"></polyline>
                  <line x1="12" y1="19" x2="20" y2="19"></line>
                </svg>
                <span>Full RFC 822 Header Dump</span>
              </div>
              <button class="copy-btn" onclick="copyRawHeaders()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span>Copy Headers</span>
              </button>
            </div>
            <div class="raw-headers-content expanded">
              <pre class="raw-header-pre">${highlightHeaders(email.rawHeaders)}</pre>
            </div>
          </div>
        </div>
      `;
    }

    /**
     * Helper to render IOC summary snippet in main overview
     */
    function renderIOCSummarySnippet(email) {
      let html = '';
      if (email.iocs.links.length > 0) {
        const link = email.iocs.links[0];
        html += `
          <div class="link-inspector-card">
            <div style="font-size: 0.6875rem; color: var(--text-tertiary); text-transform: uppercase; font-family: var(--font-mono);">Detected URL Redirect</div>
            <div style="font-family: var(--font-mono); font-size: 0.75rem; display: flex; align-items: center; justify-content: space-between;">
              <span style="color: ${link.virustotal.includes('0/92') ? 'var(--risk-pass)' : 'var(--risk-critical)'}; word-break: break-all;">
                ${escapeHtml(link.finalDestination)}
              </span>
              <button class="copy-btn" onclick="copyText('${escapeHtml(link.finalDestination)}')">Copy</button>
            </div>
            <div style="font-size: 0.71875rem; color: var(--text-muted);">
              Flag: ${link.virustotal} • Domain age: ${link.domainAge}
            </div>
          </div>
        `;
      }

      if (email.iocs.attachments.length > 0) {
        const att = email.iocs.attachments[0];
        html += `
          <div class="attachment-card" style="margin-top: 8px;">
            <div style="font-size: 0.6875rem; color: var(--text-tertiary); text-transform: uppercase; font-family: var(--font-mono);">High-Risk Payload Attachment</div>
            <div style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--risk-critical); font-weight: 600;">
              ${escapeHtml(att.name)} (MIME Mismatch: ${escapeHtml(att.verifiedMime)})
            </div>
            <div class="hash-copy-bar" style="margin-top: 4px;">
              <span class="hash-text">${escapeHtml(att.sha256)}</span>
              <button class="copy-btn" onclick="copyText('${escapeHtml(att.sha256)}')">Copy SHA256</button>
            </div>
          </div>
        `;
      }

      if (!html) {
        html = `<div style="font-size: 0.78125rem; color: var(--text-muted);">No critical binary attachments or external redirection hops flagged.</div>`;
      }

      return html;
    }

    /**
     * Syntax highlighter for RFC headers
     */
    function highlightHeaders(raw) {
      if (!raw) return "";
      const lines = raw.split("\n");
      return lines.map(line => {
        const colonIdx = line.indexOf(":");
        if (colonIdx > 0 && !line.startsWith(" ") && !line.startsWith("\t")) {
          const key = line.substring(0, colonIdx);
          const val = line.substring(colonIdx + 1);

          let valClass = "hv";
          if (val.includes("fail") || val.includes("REJECT") || val.includes("softfail")) {
            valClass = "h-warn";
          }

          return `<span class="hk">${escapeHtml(key)}:</span><span class="${valClass}">${escapeHtml(val)}</span>`;
        }
        return `<span class="hv">${escapeHtml(line)}</span>`;
      }).join("\n");
    }

    /**
     * Highlight suspicious tokens in sanitized plaintext body
     */
    function highlightBodyThreats(text) {
      if (!text) return "";
      let safe = escapeHtml(text);
      safe = safe.replace(/(https?:\/\/[^\s]+)/g, '<span class="body-link-flagged">$1</span>');
      safe = safe.replace(/(PERMANENTLY SUSPENDED|URGENT NOTICE|immediate payment|court proceedings)/gi, '<strong style="color: var(--risk-critical);">$1</strong>');
      return safe;
    }

    /**
     * Fast Triage Action Handlers
     */
    function attachActionHandlers(email) {
      const qBtn = document.getElementById("btn-quarantine");
      const aBtn = document.getElementById("btn-allowlist");
      const bBtn = document.getElementById("btn-ban-domain");
      const eBtn = document.getElementById("btn-export-eml");

      if (qBtn) {
        qBtn.onclick = () => {
          email.status = email.status === "quarantined" ? "active" : "quarantined";
          showToast(
            email.status === "quarantined"
              ? `Message ${email.id} quarantined. Removed from all enterprise inboxes.`
              : `Message ${email.id} restored to review queue.`,
            "danger"
          );
          renderEmailList();
          renderForensicPane();
        };
      }

      if (aBtn) {
        aBtn.onclick = () => {
          email.status = "allowlisted";
          showToast(`Sender domain @${email.sender.displayDomain} added to trusted tenant allowlist.`, "success");
          renderEmailList();
          renderForensicPane();
        };
      }

      if (bBtn) {
        bBtn.onclick = () => {
          showToast(`Perimeter block rule deployed for domain: ${email.sender.displayDomain}`, "danger");
        };
      }

      if (eBtn) {
        eBtn.onclick = () => {
          exportEml(email);
        };
      }
    }

    function exportEml(email) {
      const blob = new Blob([email.rawHeaders + "\n\n" + email.bodyText], { type: "message/rfc822" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${email.id}-${email.sender.displayDomain}.eml`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`Exported RFC 822 message to ${email.id}.eml`, "success");
    }

    function copyRawHeaders() {
      const email = INCIDENT_DATABASE.find(item => item.id === currentSelectedId);
      if (email) {
        copyText(email.rawHeaders);
        showToast("Full RFC 822 headers copied to clipboard.", "success");
      }
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast("Copied to clipboard.", "success");
      }).catch(() => {
        showToast("Failed to write to clipboard.", "danger");
      });
    }

    function showToast(message, type = "info") {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = `toast-card ${type}`;
      toast.innerHTML = `
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          ${type === 'danger'
            ? '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>'
            : '<polyline points="20 6 9 17 4 12"></polyline>'}
        </svg>
        <span>${escapeHtml(message)}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 3200);
    }

    function switchView(viewName) {
      currentView = viewName;
      viewTabs.forEach(t => {
        t.classList.toggle("active", t.getAttribute("data-view") === viewName);
      });
      renderForensicPane();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Keyboard Navigation & Shortcuts
    window.addEventListener("keydown", (e) => {
      // Avoid hotkeys when typing in input
      if (document.activeElement === searchInputEl) {
        if (e.key === "Escape") {
          searchInputEl.blur();
        }
        return;
      }

      const visible = getVisibleIncidents();
      const currentIndex = visible.findIndex(item => item.id === currentSelectedId);

      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (currentIndex < visible.length - 1) {
          selectIncident(visible[currentIndex + 1].id);
        }
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (currentIndex > 0) {
          selectIncident(visible[currentIndex - 1].id);
        }
      } else if (e.key.toLowerCase() === "q") {
        e.preventDefault();
        const qBtn = document.getElementById("btn-quarantine");
        if (qBtn) qBtn.click();
      } else if (e.key.toLowerCase() === "a") {
        e.preventDefault();
        const aBtn = document.getElementById("btn-allowlist");
        if (aBtn) aBtn.click();
      } else if (e.key.toLowerCase() === "b") {
        e.preventDefault();
        const bBtn = document.getElementById("btn-ban-domain");
        if (bBtn) bBtn.click();
      } else if (e.key.toLowerCase() === "e") {
        e.preventDefault();
        const eBtn = document.getElementById("btn-export-eml");
        if (eBtn) eBtn.click();
      } else if (e.key === "/") {
        e.preventDefault();
        searchInputEl.focus();
      }
    });

    // Event Listeners for Filters & Search
    filterButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        filterButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.getAttribute("data-filter");
        renderEmailList();
        renderForensicPane();
      });
    });

    viewTabs.forEach(tab => {
      tab.addEventListener("click", () => {
        switchView(tab.getAttribute("data-view"));
      });
    });

    searchInputEl.addEventListener("input", () => {
      renderEmailList();
      renderForensicPane();
    });

    sortSelectEl.addEventListener("change", () => {
      renderEmailList();
      renderForensicPane();
    });

    // Initial render
    renderEmailList();
    renderForensicPane();
  </script>
</body>
</html>
