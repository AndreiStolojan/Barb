x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongodb:
    profiles: [local-db]
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    image: mongo:8.0.28@sha256:5351bff2b5d1563e3fa603a74b9be85ef9323e10aeb0b45cea933a93876e77fd
    restart: unless-stopped
    logging: *default-logging
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-secureinbox}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-secureinbox_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Credentials come from the container env inside --eval, not argv, so
      # they never show up in the host process list. ping alone needs no
      # auth; a failed auth() throws and exits non-zero.
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--norc",
          "--eval",
          "const admin = db.getSiblingDB('admin'); admin.auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD); quit(admin.runCommand({ ping: 1 }).ok === 1 ? 0 : 1)"
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "5500"
      APP_HOST: 0.0.0.0
      DB_URI: ${DB_URI:-mongodb://${MONGO_ROOT_USERNAME:-secureinbox_root}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE:-secureinbox_dev}?authSource=admin}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      MAIL_TOKEN_ENCRYPTION_KEY: ${MAIL_TOKEN_ENCRYPTION_KEY}
      FRONTEND_APP_URL: ${FRONTEND_APP_URL:-http://localhost:${APP_PORT:-8080}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/mail-accounts/google/callback}
      GMAIL_PUSH_ENABLED: ${GMAIL_PUSH_ENABLED:-false}
      GOOGLE_CLOUD_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT_ID:-}
      GMAIL_PUBSUB_TOPIC: ${GMAIL_PUBSUB_TOPIC:-}
      GMAIL_PUSH_AUDIENCE: ${GMAIL_PUSH_AUDIENCE:-}
      GMAIL_PUSH_SERVICE_ACCOUNT_EMAIL: ${GMAIL_PUSH_SERVICE_ACCOUNT_EMAIL:-}
      GMAIL_POLL_INTERVAL_WITH_PUSH: ${GMAIL_POLL_INTERVAL_WITH_PUSH:-60}
      THREAT_INTEL_ENABLED: ${THREAT_INTEL_ENABLED:-false}
      WEB_RISK_API_KEY: ${WEB_RISK_API_KEY:-}
      URLHAUS_AUTH_KEY: ${URLHAUS_AUTH_KEY:-}
      THREAT_INTEL_MAX_URLS_PER_EMAIL: ${THREAT_INTEL_MAX_URLS_PER_EMAIL:-5}
      THREAT_INTEL_TIMEOUT_MS: ${THREAT_INTEL_TIMEOUT_MS:-10000}
      ATTACHMENT_ANALYSIS_ENABLED: ${ATTACHMENT_ANALYSIS_ENABLED:-false}
      ATTACHMENT_ANALYSIS_CONCURRENCY: ${ATTACHMENT_ANALYSIS_CONCURRENCY:-3}
      ATTACHMENT_ANALYSIS_TIMEOUT_MS: ${ATTACHMENT_ANALYSIS_TIMEOUT_MS:-15000}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      ARCJET_KEY: ${ARCJET_KEY:-}
      ARCJET_ENV: ${ARCJET_ENV:-development}
      AI_SEMANTIC_ENABLED: ${AI_SEMANTIC_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-300000}
      SCAN_CONCURRENCY: ${SCAN_CONCURRENCY:-1}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-15}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      EMAIL_AUTH_RAW_FETCH_TIMEOUT_MS: ${EMAIL_AUTH_RAW_FETCH_TIMEOUT_MS:-10000}
      EMAIL_AUTH_VERIFY_TIMEOUT_MS: ${EMAIL_AUTH_VERIFY_TIMEOUT_MS:-5000}
      EMAIL_AUTH_MAX_RAW_BYTES: ${EMAIL_AUTH_MAX_RAW_BYTES:-33554432}
      EMAIL_AUTH_MAX_CONCURRENCY: ${EMAIL_AUTH_MAX_CONCURRENCY:-2}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-10485760}
      ATTACHMENT_MAX_TOTAL_BYTES: ${ATTACHMENT_MAX_TOTAL_BYTES:-26214400}
      ATTACHMENT_MAX_COUNT: ${ATTACHMENT_MAX_COUNT:-10}
      MALWAREBAZAAR_AUTH_KEY: ${MALWAREBAZAAR_AUTH_KEY:-}
      DEMO_USER_NAME: ${DEMO_USER_NAME:-Demo User}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@secureinbox.test}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
    expose:
      - "5500"
    depends_on:
      mongodb:
        condition: service_healthy
        required: false
    # Each probe is a full process start (node: ~0.23 CPU-s, mongosh: ~0.65 on
    # the Pi), so they run every 60 s. start_interval keeps startup and
    # `up --wait` fast: inside start_period Docker probes every 2 s.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5500/api/v1/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  ollama:
    profiles: [ai]
    image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    restart: unless-stopped
    logging: *default-logging
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: "4096"
      # Must stay ABOVE SYNC_INTERVAL_MINUTES. At 10m with a 15m sync the model
      # was evicted between every cycle, so each scan run began by reloading
      # ~4.7 GB from disk before doing any work.
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_NO_CLOUD: "1"
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s

volumes:
  mongo-data:
  ollama-data:
