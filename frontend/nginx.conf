server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    # Security headers live ONLY at server level. nginx drops every inherited
    # add_header in a location that declares its own, so the locations below
    # set caching with `expires` instead of add_header.
    #
    # The CSP backs up the email sanitizer: rendered mail can never run script,
    # load styles or fonts from elsewhere, or be framed. Images stay https: so a
    # safe message (or one the reader chose to load) can still show pictures.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://backend:5500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
        proxy_connect_timeout 10s;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        # Hashed file names: safe to cache for a year.
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # The shell must revalidate so a deploy is picked up (Cache-Control: no-cache).
        expires -1;
    }
}
