# Production overlays the same application and images used in development.
# Selected by COMPOSE_FILE in the root .env.
services:
  backend:
    environment:
      NODE_ENV: production
      DB_URI: ${DB_URI:?Set an Atlas DB_URI in .env}
      FRONTEND_APP_URL: ${FRONTEND_APP_URL:?Set the public HTTPS URL}
      SEED_DEMO: "false"
    depends_on: !reset {}

  frontend:
    ports: !reset []
    volumes:
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [default, edge]

  cloudflared:
    image: cloudflare/cloudflared:2026.7.2@sha256:4f6655284ab3d252b7f28fedb19fe6c8fc82ee5b1295c20ac74d475e5398a52d
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}
    # No depends_on on frontend, deliberately. nginx.prod.conf resolves the
    # name `cloudflared` (set_real_ip_from) when it starts, so the tunnel must
    # exist first; waiting for a healthy frontend made each wait on the other
    # and the first consolidated deployment came up with no frontend. The
    # tunnel retries its origin on its own until nginx answers.
    networks: [edge]

networks:
  edge:
